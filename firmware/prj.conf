# Console and floating-point formatting
CONFIG_PRINTK=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# Thread stack sizing
CONFIG_MAIN_STACK_SIZE=2048

# I2C driver and hardware emulation
CONFIG_I2C=y
CONFIG_EMUL=y
CONFIG_I2C_EMUL=y

# Interactive shell over console stdin/stdout
CONFIG_SHELL=y
CONFIG_NATIVE_UART_0_ON_STDINOUT=y