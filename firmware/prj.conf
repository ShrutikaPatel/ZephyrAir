# Enable console printing
CONFIG_PRINTK=y
# Enable floating-point formatting in printk (needed for pressure/temperature)
CONFIG_CBPRINTF_FP_SUPPORT=y
# Stack and heap configuration
CONFIG_MAIN_STACK_SIZE=2048
# Enable I2C driver subsystem
CONFIG_I2C=y
# Enable Zephyr hardware emulator framework
CONFIG_EMUL=y
CONFIG_I2C_EMUL=y

  